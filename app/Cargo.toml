[package]
name = "kittypass-app"
version = "1.0.1"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "time", "net", "io-util", "macros"] }
kittypass-core = { version = "1.0.1", path = "../core", features = ["client"] }
zeroize = { version = "1.9.1", features = ["serde"] }
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
base64 = "0.23.1"
axum = "0.8.9"
rusqlite = "0.41.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
kittypass-server = { path = "../server" }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
