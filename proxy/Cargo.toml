[package]
name = "kittypass-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Relais de messagerie native entre l'extension KeePassXC-Browser et KittyPass"

[dependencies]
kittypass-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
kittypass-app = { path = "../app" }
base64 = "0.23.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "macros"] }
