name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Dépendances système (Tauri, tests KeePassXC)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev keepassxc
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - name: Audit des dépendances
        run: cargo install cargo-audit --locked && cargo audit
      - name: Licences, crates interdites, provenance (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzzing court de chaque cible (30 s)
        working-directory: core/fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            mkdir -p "corpus/$t"
            cargo +nightly fuzz run -O "$t" "corpus/$t" "seeds/$t" -- -max_total_time=30 -timeout=10
          done

  desktop:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows : installeurs NSIS (.exe) et MSI.
          - os: windows-latest
            bundles: nsis,msi
          # Linux autre que Debian : AppImage construite sur une base ancienne
          # (glibc 2.35) pour fonctionner sur un maximum de distributions.
          - os: ubuntu-22.04
            bundles: appimage
          # macOS (Apple Silicon) : .dmg non signé (clic droit → Ouvrir).
          - os: macos-15
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo install tauri-cli --version "^2" --locked
      # Avec la clé de signature (secret), les fichiers de mise à jour
      # intégrée (.sig, .app.tar.gz) sont produits aussi.
      - name: Compilation
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cfg=()
          [ "$RUNNER_OS" = Linux ] && cfg+=(--config tauri.linux.json)
          [ "$RUNNER_OS" = macOS ] && cfg+=(--config tauri.macos.json)
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && cfg+=(--config tauri.updater.json)
          cargo tauri build --bundles ${{ matrix.bundles }} "${cfg[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: kittypass-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig

  debian:
    needs: tests
    runs-on: ubuntu-latest
    # Paquet .deb construit dans un vrai Debian 13 (trixie).
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config file libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - run: |
          . "$HOME/.cargo/env"
          cargo install tauri-cli --version "^2" --locked
          cd desktop && cargo tauri build --bundles deb --config tauri.linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: kittypass-debian
          path: target/release/bundle/deb/*.deb

  # iOS (expérimental) : .ipa NON signé, à installer avec Sideloadly ou
  # AltStore et un identifiant Apple (à réinstaller tous les 7 jours).
  ios:
    needs: tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Projet Xcode
        working-directory: desktop
        run: cargo tauri ios init --ci
      - name: Compilation sans signature
        working-directory: desktop
        run: |
          proj=$(ls -d gen/apple/*.xcodeproj | head -n1)
          scheme=$(xcodebuild -list -project "$proj" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          echo "projet $proj, schéma $scheme"
          # La phase « Build Rust Code » de Xcode exige que « tauri ios build »
          # tourne (lequel impose une signature) : la bibliothèque Rust est
          # compilée ici et la phase remplacée par « true ».
          cargo build --release --lib --target aarch64-apple-ios --features tauri/custom-protocol
          mkdir -p gen/apple/Externals/arm64/release
          cp ../target/aarch64-apple-ios/release/libkittypass_desktop_lib.a gen/apple/Externals/arm64/release/libapp.a
          perl -i -pe 's/shellScript = ".*xcode-script.*";/shellScript = "true";/' "$proj/project.pbxproj"
          grep -q xcode-script "$proj/project.pbxproj" && { echo "phase Rust non remplacée"; exit 1; }
          xcodebuild -project "$proj" -scheme "$scheme" -configuration release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          app=$(find build-ios/Build/Products -name '*.app' -maxdepth 2 | head -n1)
          mkdir -p ipa/Payload && cp -R "$app" ipa/Payload/
          (cd ipa && zip -qr ../KittyPass-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: kittypass-ios
          path: desktop/KittyPass-unsigned.ipa

  # Image Docker du serveur : construite à chaque push, publiée sur
  # ghcr.io/xadupi/kittypass-server pour les tags vX.Y.Z (et « latest »).
  docker:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xadupi/kittypass-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Image de test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kittypass-test
          cache-from: type=gha
      - name: Essai de l'image
        run: |
          docker run -d --name kp -p 8080:8080 kittypass-test
          for i in $(seq 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/health
          docker exec kp kittypass-server invite --admin | grep -q .
          for i in $(seq 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' kp)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' kp | grep -qx healthy
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  server-linux:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: bash deploy/linux/make-installer.sh
      - run: bash deploy/proxmox/make-installer.sh
      - run: bash -n deploy/proxmox/kittypass-proxmox.sh && bash -n deploy/proxmox/kittypass.sh && bash -n deploy/linux/kittypass.sh
      - name: Installation
        run: sudo PROXY_IP=127.0.0.1 bash deploy/linux/kittypass-linux.sh < /dev/null
      - name: Vérifications
        run: |
          systemctl is-active kittypass
          curl -fs http://127.0.0.1:8080/health
          sudo test -f /etc/kittypass.env
      - name: Mise à jour puis désinstallation
        run: |
          sudo bash deploy/linux/kittypass-linux.sh --update < /dev/null
          systemctl is-active kittypass
          for i in $(seq 20); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/health
          test -x /usr/local/sbin/kittypass-update
          sudo kittypass-update --auto on && systemctl is-enabled kittypass-update.timer
          sudo kittypass-update --auto off
          sudo kittypass-update --check || echo "(pas encore de Release publiée)"
          sudo bash deploy/linux/kittypass-linux.sh --uninstall < /dev/null
          ! systemctl is-active kittypass
          sudo test -d /var/lib/kittypass
      - uses: actions/upload-artifact@v4
        with:
          name: kittypass-server-linux
          path: |
            deploy/linux/kittypass-linux.sh
            deploy/proxmox/kittypass-proxmox.sh

  server-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p kittypass-server
      - name: Paquet
        shell: pwsh
        run: |
          $d = "KittyPass-Server"; New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/kittypass-server.exe, deploy/windows/install.ps1, deploy/windows/Installer.cmd $d
          $h = (Get-FileHash "$d/kittypass-server.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content "$d/kittypass-server.exe.sha256" "$h  kittypass-server.exe"
          Compress-Archive $d kittypass-server-windows.zip
      - name: Installation et vérifications
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File KittyPass-Server/install.ps1 -Port 8080
          if ($LASTEXITCODE) { exit 1 }
          Get-ScheduledTask -TaskName "KittyPass Server" | Out-Null
          Get-NetFirewallRule -DisplayName "KittyPass Server" | Out-Null
          Invoke-WebRequest http://127.0.0.1:8080/health -UseBasicParsing | Out-Null
      - name: Désinstallation
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File KittyPass-Server/install.ps1 -Uninstall
          if ($LASTEXITCODE) { exit 1 }
          if (Get-ScheduledTask -TaskName "KittyPass Server" -ErrorAction SilentlyContinue) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: kittypass-server-windows.zip
          path: kittypass-server-windows.zip

  # APK Android signé : seulement si la clé est fournie en secret
  # (ANDROID_KEYSTORE_B64 = keystore en base64, ANDROID_KEYSTORE_PASS).
  android:
    needs: tests
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_KEY == 'true'
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: NDK et outils de compilation
        if: env.HAS_KEY == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;35.0.0" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - if: env.HAS_KEY == 'true'
        run: cargo install tauri-cli --version "^2" --locked
      - if: env.HAS_KEY == 'true'
        working-directory: desktop
        run: cargo tauri android build --apk --target aarch64 --target x86_64
      - name: Signature
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          bt="$ANDROID_HOME/build-tools/35.0.0"
          v=$(jq -r .version desktop/tauri.conf.json)
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          apk=$(find desktop/gen/android -name 'app-universal-release-unsigned.apk' | head -n1)
          "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass env:KS_PASS --out "KittyPass-$v.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify "KittyPass-$v.apk"
          rm -f -- "$RUNNER_TEMP/ks.jks" "KittyPass-$v.apk.idsig"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: kittypass-android
          path: KittyPass-*.apk

  # Release GitHub créée pour chaque tag vX.Y.Z, avec tous les fichiers,
  # SHA256SUMS.txt et latest.json (mise à jour intégrée de l'appli).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, debian, ios, android, docker, server-linux, server-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Seulement nos fichiers (pas les traces de build Docker).
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: kittypass-*
      - name: Fichiers de la Release
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir out
          find art -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.ipa' -o -name '*.apk' -o -name '*.sh' -o -name '*.zip' \
            -o -name '*.sig' -o -name '*.app.tar.gz' \) -exec cp -- {} out/ \;
          # Archive de mise à jour macOS : nom versionné.
          if [ -f out/KittyPass.app.tar.gz ]; then
            mv out/KittyPass.app.tar.gz "out/KittyPass_${v}_aarch64.app.tar.gz"
            mv out/KittyPass.app.tar.gz.sig "out/KittyPass_${v}_aarch64.app.tar.gz.sig"
          fi
          python3 - "$v" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" <<'PY'
          import json, os, sys, datetime
          v, tag, repo = sys.argv[1:]
          files = os.listdir("out")
          def pick(suffix):
              for f in sorted(files):
                  if f.endswith(suffix) and f + ".sig" in files:
                      return {"signature": open(f"out/{f}.sig").read().strip(),
                              "url": f"https://github.com/{repo}/releases/download/{tag}/{f}"}
          platforms = {k: p for k, p in {
              "windows-x86_64": pick("_x64-setup.exe"),
              "darwin-aarch64": pick("_aarch64.app.tar.gz"),
              "linux-x86_64": pick("_amd64.AppImage"),
          }.items() if p}
          if platforms:
              json.dump({"version": v, "notes": f"https://github.com/{repo}/releases/tag/{tag}",
                         "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                         "platforms": platforms}, open("out/latest.json", "w"), indent=2)
              print("latest.json :", ", ".join(platforms))
          else:
              print("pas de signature de mise à jour : latest.json non créé")
          PY
          cd out && sha256sum -- $(ls | grep -vE '\.sig$|^latest\.json$') > SHA256SUMS.txt
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          make_latest: true
          prerelease: false
          generate_release_notes: true
