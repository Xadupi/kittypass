[package]
name = "kittypass-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
zeroize = "1"
kittypass-core = { path = ".." }

# Hors de l'espace de travail : compilé seulement par `cargo fuzz` (nightly).
[workspace]
members = ["."]

[profile.release]
debug = 1

[patch.crates-io]
keepass = { path = "../../vendor/keepass" }
zxcvbn = { path = "../../vendor/zxcvbn" }

[[bin]]
name = "kdbx"
path = "fuzz_targets/kdbx.rs"
test = false
doc = false
bench = false

